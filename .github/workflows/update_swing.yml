name: Actualizador Automatico Especulador

on:
  schedule:
    # Programado en UTC para coincidir exactamente con Hora Peninsular Española (CEST / UTC+2):
    # - 08:30 UTC -> 10:30 España
    # - 13:30 UTC -> 15:30 España (Apertura Wall Street)
    # - 14:00 UTC -> 16:00 España
    # - 15:30 UTC -> 17:30 España
    # - 17:00 UTC -> 19:00 España
    # - 19:30 UTC -> 21:30 España
    # - 21:30 UTC -> 23:30 España (Cierre Wall Street)
    - cron: '30 8,13,15,19,21 * * 1-5'
    - cron: '0 14,17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas lxml requests beautifulsoup4

      - name: Ejecutar Scanner Swing
        run: python fetcher_swing.py

      - name: Ejecutar Backtest de Medias
        run: python backtest_medias.py

      - name: Guardar y publicar cambios en GitHub
        run: |
          git config --global user.name "especulador-bot"
          git config --global user.email "bot@especulador.local"
          git add swing_data.json backtest_data.json
          git commit -m "Precios, setups y backtest actualizados en background [skip ci]" || exit 0
          git push
